<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 DRILL 2</title>
<style>
    body {background-color:rgba(30, 193, 103, 0.875);color: aliceblue;
    font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
}
 </style>
</head>
<body>
    <h1> Rate a Movie</h1>
    <h2> Write a review on a movie you have watched recently.</h2>
    <img src="https://img.magnific.com/free-vector/cinema-film-production-realistic-transparent-composition-with-isolated-image-clapper-with-empty-fields-vector-illustration_1284-66163.jpg?semt=ais_hybrid&w=740&q=80" width="300px" height="200px"
    <br>
    <h2>Movie Information</h2>
    <form>
        <label for="title"> Title of the Movie: </label>
        <input type="text" name="title" id="name" placeholder="Write title here">
        <br>
         <h3> Genre of the movie: </h3>
         <input type="checkbox" id="genre" name="genre" value="Action">
         <label for="genre">Action</label>
         <br>
          <input type="checkbox" id="genre" name="genre" value="Comedy">
         <label for="genre">Comedy</label>
         <br>
         <input type="checkbox" id="genre" name="genre" value="Sci-Fi">
         <label for="genre">Sci-Fi</label>
         <br>
         <input type="checkbox" id="genre" name="genre" value="Drama">
         <label for="genre">Drama</label>
         <br>
         <input type="checkbox" id="genre" name="genre" value="Fantasy">
         <label for="genre">Fantasy</label>
         <br>
         <h3>Rating:</h3>
         <input type="radio" id="1rating" name="rating" value="1rating"
         <label for="rating">⭐</label>
         <input type="radio" id="2rating" name="rating" value="2rating"
         <label for="rating">⭐⭐</label>
          <input type="radio" id="3rating" name="rating" value="3rating"
         <label for="rating">⭐⭐⭐</label>
          <input type="radio" id="4rating" name="rating" value="4rating"
         <label for="rating">⭐⭐⭐⭐</label>
        <input type="radio" id="5rating" name="rating" value="5rating"
         <label for="rating">⭐⭐⭐⭐⭐</label>
         <h3>Share your feedback!</h3>
        <label for="thoughts">Write your thoughts:</label>
        <br>
        <textarea id="thoughts" name="thoughts" rows="4" cols="50" placeholder="type here"></textarea>
        <br>
        <input type="button" value="submit" name="submit">
    </form>
</body>
</html>
